<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="歡迎來到鄭阿阿的個人小天地。">
<title>鄭阿阿｜我的小天地</title>
<style>
:root{--paper:#fff8e9;--accent:#fa693f;--ink:#233d36;--soft:#f5d768}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;transition:background .3s}a{color:inherit}header,main,footer{max-width:1120px;margin:auto;padding:0 32px}header{height:100px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px;text-decoration:none}.brand span{color:var(--accent)}nav a{text-decoration:none;font-size:14px;border-bottom:1px solid;padding-bottom:5px}.hero{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:50px;align-items:center;padding:65px 0 95px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;display:flex;align-items:center;gap:10px}.eyebrow:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}h1{font-size:clamp(48px,7vw,88px);line-height:1.18;letter-spacing:-4px;margin:30px 0}h1 span{color:var(--accent)}.intro{font-size:18px;line-height:1.9;max-width:390px}.button{display:inline-block;margin-top:24px;padding:16px 24px;border:0;border-radius:100px;background:var(--ink);color:white;text-decoration:none;font-size:15px;font-weight:bold;cursor:pointer}.button:hover{transform:translateY(-3px)}.art{position:relative;min-height:390px;display:grid;place-items:center}.orbit{width:340px;height:340px;border:1px dashed #233d3666;border-radius:50%;position:absolute;transform:rotate(-15deg)}.face{background:var(--soft);width:270px;height:290px;border-radius:48% 48% 43% 43%;position:relative;transform:rotate(-9deg);box-shadow:12px 15px 0 #233d36}.eyes{position:absolute;top:105px;left:69px;display:flex;gap:65px}.eyes i{width:15px;height:29px;background:var(--ink);border-radius:50%}.smile{position:absolute;top:143px;left:103px;width:66px;height:42px;border-bottom:7px solid var(--ink);border-radius:0 0 60px 60px}.cheek{position:absolute;top:150px;left:46px;width:35px;height:17px;background:#f4946e;border-radius:50%;box-shadow:143px 0 #f4946e}.star{position:absolute;right:10px;top:10px;font-size:86px;color:var(--accent);transform:rotate(12deg)}.tag{position:absolute;bottom:16px;left:4px;background:#fffef8;border:2px solid var(--ink);padding:15px 22px;transform:rotate(-8deg);font-weight:900;box-shadow:4px 4px 0 var(--ink)}.wave{position:absolute;right:0;bottom:45px;font-size:51px;transform:rotate(15deg)}.about{border-top:2px solid var(--ink);padding:40px 0 60px;display:grid;grid-template-columns:1fr 2fr;gap:50px}.section-label{font-size:13px;letter-spacing:2px}h2{font-size:30px;margin:16px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fact{border-bottom:1px solid #233d3644;padding:14px 0 25px}.fact small{font-size:13px}.fact strong{display:block;font-size:29px;margin-top:15px}.hello{grid-column:1/-1;background:#e2ebd8;padding:25px 30px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.hello p{margin:0;line-height:1.8}.hello button{background:transparent;border:1px solid var(--ink);border-radius:50%;width:52px;height:52px;flex-shrink:0;cursor:pointer;font-size:24px;color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}footer{padding-top:25px;padding-bottom:30px;display:flex;justify-content:space-between;font-size:12px;border-top:1px solid #233d3633}.status{font-size:13px;margin:12px 0 0;min-height:20px}@media(max-width:700px){header,main,footer{padding-left:24px;padding-right:24px}header{height:80px}.hero{grid-template-columns:1fr;padding:35px 0 55px;gap:20px}h1{letter-spacing:-2px}.art{min-height:350px}.orbit{width:290px;height:290px}.face{width:250px;height:270px}.star{right:5px}.about{grid-template-columns:1fr;gap:15px}.facts{gap:18px}.fact strong{font-size:25px}.hello{padding:22px}footer{gap:20px;line-height:1.7}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.button:hover{transform:none}}
</style>
</head>
<body>
<header><a class="brand" href="#">阿阿的小天地<span> ✳</span></a><nav aria-label="主要導覽"><a href="#about">認識我 ↗</a></nav></header>
<main>
<section class="hero" aria-labelledby="welcome">
<div><div class="eyebrow">WELCOME TO MY WORLD</div><h1 id="welcome">嗨，你好！<br>我是<span>鄭阿阿。</span></h1><p class="intro">歡迎來到我的個人網站。<br>這裡是屬於我的小小天地，很高興認識你！</p><a class="button" href="#about">來認識我吧 <span aria-hidden="true">↗</span></a></div>
<div class="art" role="img" aria-label="黃色笑臉與橘色星星插畫"><div class="orbit"></div><div class="face"><div class="eyes"><i></i><i></i></div><div class="cheek"></div><div class="smile"></div></div><span class="star">✳</span><span class="tag">HELLO, I'M 阿阿！</span><span class="wave">✦</span></div>
</section>
<section class="about" id="about" aria-labelledby="about-title"><div><span class="section-label">01 / ABOUT ME</span><h2 id="about-title">關於我</h2><p>先從一個簡單的自我介紹開始。</p></div><div class="facts"><div class="fact"><small>我的名字</small><strong>鄭阿阿</strong></div><div class="fact"><small>我的年齡</small><strong>10 歲</strong></div><div class="hello"><p>替我的小天地換個顏色吧！<br><small>點一下右邊的按鈕，看看不同的心情。</small></p><button id="color" type="button" aria-label="切換網站背景顏色">✳</button></div><p class="status" id="status" role="status" aria-live="polite"></p></div></section>
</main>
<footer><span>鄭阿阿 · 我的個人小天地</span><span>謝謝你的來訪 ☺</span></footer>
<script>
const palettes=[['#fff8e9','奶油黃'],['#eef5ff','天空藍'],['#fff0f2','櫻花粉'],['#edf6ed','嫩葉綠']];let current=0;document.getElementById('color').addEventListener('click',()=>{current=(current+1)%palettes.length;document.documentElement.style.setProperty('--paper',palettes[current][0]);document.getElementById('status').textContent='現在是'+palettes[current][1]+'的心情！';});
</script>
</body>
</html>
